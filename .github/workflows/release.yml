name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          package-manager-cache: false

      - name: Install
        run: npm ci

      - name: Ensure unique version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            npm version patch --no-git-tag-version
            VERSION=$(node -p "require('./package.json').version")
            echo "Version already released — bumped to ${VERSION}"
          else
            echo "Using package.json version ${VERSION}"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Commit version and create tag
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: bump version to v${VERSION} [skip ci]"
            git push origin HEAD:main
          fi
          if ! git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            git tag "v${VERSION}"
            git push origin "v${VERSION}"
          fi

      - name: Prepare private update auth
        shell: bash
        env:
          UPDATE_CHECK_TOKEN: ${{ secrets.UPDATE_CHECK_TOKEN }}
        run: |
          if [ -z "${UPDATE_CHECK_TOKEN}" ]; then
            echo "::warning::UPDATE_CHECK_TOKEN assente: ok se la repo è pubblica. Per repo privata serve un PAT Contents:Read."
          fi
          node scripts/prepare-update-auth.cjs

      - name: Build Windows installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SRC_SETUP="release/Webison Mailer-Setup-${VERSION}.exe"
          SRC_BLOCKMAP="release/Webison Mailer-Setup-${VERSION}.exe.blockmap"
          YML="release/latest.yml"
          SETUP="release/Webison-Mailer-Setup-${VERSION}.exe"
          BLOCKMAP="release/Webison-Mailer-Setup-${VERSION}.exe.blockmap"

          test -f "$SRC_SETUP"
          test -f "$YML"
          cp "$SRC_SETUP" "$SETUP"
          if [ -f "$SRC_BLOCKMAP" ]; then
            cp "$SRC_BLOCKMAP" "$BLOCKMAP"
          fi

          FILES=("$SETUP" "$YML")
          if [ -f "$BLOCKMAP" ]; then
            FILES+=("$BLOCKMAP")
          fi

          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release upload "v${VERSION}" "${FILES[@]}" --clobber
          else
            gh release create "v${VERSION}" "${FILES[@]}" \
              --title "Webison Mailer ${VERSION}" \
              --notes "Release automatica v${VERSION}" \
              --verify-tag
          fi
